categories:
  meta: Agents that manage other agents
  development: Agents/skills that write or modify code
  quality: Agents/skills that ensure code quality
  documentation: Agents/skills that create documentation
  operations: Agents/skills that handle infrastructure and deployment
  analysis: Agents/skills that research and analyze
  core: Foundational skills used by many agents
  research: Skills for information gathering
  data: Skills for database design and data management
  api: Skills for API design and implementation
  frontend: Skills for frontend development
  observability: Skills for monitoring, logging, and tracing
  performance: Skills for performance optimization
  testing: Skills for test infrastructure and tooling
  ai-generation: Skills for AI-powered content and asset generation
  game: Skills and agents specific to game engine APIs, tools, and domain knowledge
